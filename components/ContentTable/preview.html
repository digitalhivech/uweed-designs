">10&nbsp;ml</td><td class="is-num">CHF&nbsp;69.90</td><td class="is-wrap">Regular users wanting fewer drops</td></tr><tr><th scope="row">Night Blend</th><td>15&nbsp;%</td><td class="is-num">30&nbsp;ml</td><td class="is-num">CHF&nbsp;119.00</td><td class="is-wrap">Evening use, with added terpenes</td></tr></tbody></table></div><div class="uw-tbl__ind" aria-hidden="true"><span class="uw-tbl__ind-thumb"></span></div><p class="uw-tbl__hint">Tabelle seitlich wischen oder ziehen.</p><figcaption class="uw-tbl__note">Preise Stand September 2026.</figcaption></figure><p class="sec">group bands — a .uw-tbl__group row, no modifier</p><figure class="uw-tbl uw-tbl--tinted"><p class="uw-tbl__title" id="t3">CBD-Öle im Vergleich</p><div class="uw-tbl__scroll" role="region" aria-labelledby="t3"><table class="uw-tbl__data"><thead><tr><th scope="col">Product</th><th scope="col">Strength</th><th scope="col" class="is-num">Size</th><th scope="col" class="is-num">Price</th><th scope="col" class="is-wrap">Best for</th></tr></thead><tbody><tr class="uw-tbl__group"><th colspan="5" scope="colgroup">Öle</th></tr><tr><th scope="row">Swiss Extract 10%</th><td>10&nbsp;%</td><td class="is-num">10&nbsp;ml</td><td class="is-num">CHF&nbsp;39.90</td><td class="is-wrap">First-time users easing into a routine</td></tr><tr><th scope="row">Swiss Extract 20%</th><td>20&nbsp;%</td><td class="is-num">10&nbsp;ml</td><td class="is-num">CHF&nbsp;69.90</td><td class="is-wrap">Regular users wanting fewer drops</td></tr><tr><th scope="row">Night Blend</th><td>15&nbsp;%</td><td class="is-num">30&nbsp;ml</td><td class="is-num">CHF&nbsp;119.00</td><td class="is-wrap">Evening use, with added terpenes</td></tr><tr class="uw-tbl__group"><th colspan="5" scope="colgroup">Kapseln</th></tr><tr><th scope="row">Daily 10 mg</th><td>10&nbsp;mg</td><td class="is-num">60&nbsp;caps</td><td class="is-num">CHF&nbsp;49.90</td><td class="is-wrap">A fixed dose without measuring drops</td></tr><tr><th scope="row">Sport 25 mg</th><td>2 <script>
/* Content table — scroll indicator and drag-to-scroll.
   The indicator never scrolls anything: it is pointer-events:none and only
   reports position. Swipe on touch, drag or arrow-key on desktop. */
(function(){
  function init(fig){
    var sc = fig.querySelector('.uw-tbl__scroll');
    if(!sc || sc.dataset.tblReady) return;
    sc.dataset.tblReady = '1';
    var ind = fig.querySelector('.uw-tbl__ind');
    var thumb = ind && ind.querySelector('.uw-tbl__ind-thumb');
    var hint = fig.querySelector('.uw-tbl__hint');

    function update(){
      var max = sc.scrollWidth - sc.clientWidth;
      var scrollable = max > 1;
      if(ind) ind.hidden = !scrollable;
      if(hint) hint.hidden = !scrollable;
      sc.setAttribute('tabindex', scrollable ? '0' : '-1');
      if(!scrollable || !thumb) return;
      var ratio = sc.clientWidth / sc.scrollWidth;
      thumb.style.width = (ratio * 100) + '%';
      thumb.style.transform = 'translateX(' + (sc.scrollLeft / max) * (100 / ratio - 100) + '%)';
    }

    sc.addEventListener('scroll', update, { passive: true });
    if(window.ResizeObserver) new ResizeObserver(update).observe(sc);
    window.addEventListener('resize', update);
    update();

    /* Drag to scroll, mouse and pen only — touch already swipes natively
       and hijacking it breaks vertical page scrolling. */
    var down = false, startX = 0, startLeft = 0;
    sc.addEventListener('pointerdown', function(e){
      if(e.pointerType === 'touch') return;
      if(sc.scrollWidth <= sc.clientWidth) return;
      down = true; startX = e.clientX; startLeft = sc.scrollLeft;
      sc.classList.add('is-grabbing');
    });
    window.addEventListener('pointermove', function(e){
      if(!down) return;
      sc.scrollLeft = startLeft - (e.clientX - startX);
    });
    window.addEventListener('pointerup', function(){
      down = false; sc.classList.remove('is-grabbing');
    });
  }
  function initAll(root){ (root||document).querySelectorAll('.uw-tbl').forEach(init); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ initAll(); });
  else initAll();
  window.uwTableInit = initAll;
})();

</script>
</body>
</html>
