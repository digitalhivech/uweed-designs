<!-- @dsCard group="Content" height=1080 width=1100 subtitle="Up to four facts with an icon on a pink disc: as a list or as cards. On the page or on light grey, never on pink and never in the buying steps" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>IconList</title>
<style>body{margin:0;padding:16px 20px;background:var(--white);color:var(--font-color);font-family:var(--font-body)}.sec{font-family:ui-monospace,monospace;font-size:10px;font-weight:var(--fw-bold);letter-spacing:.08em;text-transform:uppercase;color:var(--medium-blue);margin:20px 0 8px}.sec:first-child{margin-top:0}.phone{width:380px;border:var(--border-hairline) solid var(--line);border-radius:var(--radius-card);padding:16px}</style></head>
<body>
<div id="root"></div>
<script>
var NS = window.UWeedDesignSystem_8df554, h = React.createElement, F = React.Fragment;
function sec(t){return h("p",{className:"sec"},t);}
var IL = NS.IconList;
var items = [
  {icon:"flask",label:"Im Labor geprüft",text:"Jede Charge wird in einem Schweizer Labor geprüft."},
  {icon:"map-pin",label:"Schweizer Marken",text:"Wir führen ausschliesslich Marken aus der Schweiz."},
  {icon:"shield-check",label:"Legal in der Schweiz",text:"Alle Produkte enthalten <1% THC."},
  {icon:"truck",label:"Schneller Versand",text:"Bestellungen vor 16:00 gehen am selben Tag raus."}];
var usps = [
  {icon:"truck",label:"Morgen geliefert",text:"Vor 16 Uhr bestellt, am nächsten Werktag bei dir; gratis ab 49 CHF."},
  {icon:"package",label:"Diskreter Versand",text:"Deine Bestellung kommt neutral verpackt."},
  {icon:"flask",label:"Laborgeprüft",text:"Den Laborbericht findest du auf jeder Produktseite."},
  {icon:"star",label:"uWeed Club",text:"5% Cashback auf jede Bestellung."}];
function Demo(){ return h(F,null,
  sec("cards — the band above the footer"),
  h(IL,{variant:"cards",eyebrow:"Warum uWeed",title:"Was du von uns erwarten kannst",items:usps}),
  sec("cards on a phone — two per row"),
  h("div",{className:"phone"},h(IL,{variant:"cards",eyebrow:"Warum uWeed",title:"Was du von uns erwarten kannst",items:usps})),
  sec("list, plain — directly on the page"),
  h(IL,{eyebrow:"Warum uWeed",title:"Was du von uns erwarten kannst",items:items}),
  sec("list, tint — a light-grey block"),
  h(IL,{surface:"tint",eyebrow:"Warum uWeed",title:"Was du von uns erwarten kannst",items:items}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
</body>
</html>
